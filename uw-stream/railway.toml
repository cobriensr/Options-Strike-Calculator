[deploy]
watchPatterns = ["uw-stream/**"]
# Restart on a NON-ZERO exit only — a confirmed lease loss / acquire timeout
# exits 1 so Railway relaunches and re-acquires; a clean SIGTERM (deploy
# supersession) exits 0 and is NOT restarted. Capped at Railway's default 10
# retries: a sustained acquire timeout means a wedged peer that needs eyes.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# SIGTERM-to-SIGKILL window for the outgoing deploy. Railway's default is 0,
# which SIGKILLs before the handler drains can flush their queues. 40 s fits
# the worst-case shutdown: every step of main._shutdown has its own bound in
# main._SHUTDOWN_STEP_TIMEOUTS_S (36.5 s in all, 30 s of it the concurrent
# handler drains, handlers.base.DRAIN_DEADLINE_S), plus a second 1 s
# release_lease that _run's finally runs after _shutdown, plus Sentry's 2 s
# flush at exit: 39.5 s.
# tests/test_handlers.py::test_drain_deadline_fits_railway_draining_seconds
# pins that arithmetic.
# The window is set in two places, both 40, and they must stay equal: this
# key, and the RAILWAY_DEPLOYMENT_DRAINING_SECONDS service variable
# (docs.railway.com/deployments/deployment-teardown#draining-time). Railway's
# Config as Code reference (docs.railway.com/config-as-code/reference) still
# documents drainingSeconds, but marks config as code deprecated: existing
# files keep working for legacy services until 2026-12-01 (checked 2026-11-08).
# After that the variable is what keeps the setting. Spec P7:
# docs/superpowers/specs/review-remediation-2026-10-26.md.
drainingSeconds = 40
# NOTE: healthcheckPath is intentionally UNSET. /healthz reports
# "ok_market_closed" overnight and on weekends (the UW channels are
# legitimately silent then), but it does NOT model market holidays — on a
# holiday weekday a connected-but-silent daemon reports 503 "stale". If
# you wire up `healthcheckPath = "/healthz"` here, Railway will restart
# the container on those holiday 503s (and on any future window where the
# health gate is stricter than reality). Only enable it after extending
# health._is_trading_hours with a holiday calendar. See src/health.py and
# docs/superpowers/specs/uw-stream-review-fixes-2026-05-28.md.
