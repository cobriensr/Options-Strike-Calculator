name: E2E Nightly

# All three browsers, every weekday after the US close, plus manual runs.
# ci.yml runs Chromium only, and only when a file the browser loads changes;
# this unfiltered run is the safety net for everything else.
on:
  schedule:
    # 23:00 UTC = 18:00 CDT / 17:00 CST, after the 15:00 CT close.
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests (all browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Own timeout below the job's 60, so a hung run still leaves time for
      # the report upload. The reporters come from playwright.config.ts (CI
      # is set on every Actions runner). --max-failures=0 overrides its CI
      # stop-after-10: with 1 worker Chromium runs first, and 10 Chromium
      # failures would otherwise stop the run before Firefox and WebKit start.
      - name: Run E2E tests
        timeout-minutes: 55
        run: npx playwright test --max-failures=0

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 14
