name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs still cancel superseded runs (one group per PR ref). Every push to main
# gets its own group (its SHA), so a quick follow-up push no longer cancels
# the previous commit's E2E verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Detect which paths changed so downstream jobs can skip when irrelevant
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ml: ${{ steps.filter.outputs.ml }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
      uw_stream: ${{ steps.filter.outputs.uw_stream }}
      nightly: ${{ steps.filter.outputs.nightly }}
      classifier: ${{ steps.filter.outputs.classifier }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            app:
              - '.github/**'
              - 'src/**'
              - 'api/**'
              - 'scripts/**'
              - 'index.html'
              - 'public/**'
              - 'vercel.json'
              - 'audit-ci.jsonc'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.api.json'
              - 'tsconfig.scripts.json'
              - 'vite.config.ts'
              - 'eslint.config.ts'
              # review lints both (and type-checks e2e/). The e2e job also
              # needs this job, so if app is skipped, e2e is skipped too.
              - 'e2e/**'
              - 'playwright.config.ts'
            # Listing ci.yml means an edit to a job's definition runs that job.
            ml:
              - 'ml/**'
              - '.github/workflows/ci.yml'
            sidecar:
              - 'sidecar/**'
              - '.github/workflows/ci.yml'
            uw_stream:
              - 'uw-stream/**'
              - '.github/workflows/ci.yml'
            nightly:
              - 'nightly/**'
              - '.github/workflows/ci.yml'
            # ml/src/multileg_*.py is the source of truth for classifier's
            # vendored copies (and a classifier Railway watchPattern).
            classifier:
              - 'classifier/**'
              - 'ml/src/multileg_*.py'
              - '.github/workflows/ci.yml'
            # What the browser loads under test. api/** is left out: the specs
            # stub /api with page.route, nothing serves the dev proxy's
            # :3000 target in CI, and eslint bars src/ from importing api/.
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'vite.config.ts'
              # Vite's esbuild reads its compilerOptions (jsx, target, ...).
              - 'tsconfig.json'
              - 'index.html'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e-nightly.yml'

  app:
    name: App Quality Gate
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Vitest + V8 coverage across 330 test files pushes past Node's
      # default ~4GB old-space ceiling. Ubuntu runners have 16GB RAM;
      # 6GB heap leaves ample OS headroom.
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # Enforce the allowlisted moderate-level gate (audit-ci.jsonc), not a
        # weaker critical-only npm audit — otherwise CI stays green while the
        # project's own gate rots (AUD-H5).
        run: npm run audit

      # No separate `npm run build` step: review already runs its type checks
      # and vite build, and Vercel runs the real build on every push.
      - name: Review (tsc + eslint + prettier + build + vitest + coverage floors)
        run: npm run review

  e2e:
    name: E2E Tests
    needs: [changes, app]
    # Chromium only, on PRs + pushes to main + manual dispatch, when a file
    # the browser loads changes (see the e2e filter above; api/-only changes
    # skip it). All three browsers run nightly in e2e-nightly.yml.
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Own timeout below the job's 30, so a hung run still leaves time for
      # the report upload.
      - name: Run E2E tests
        timeout-minutes: 25
        run: npx playwright test --project=chromium

      # always(), not !cancelled(): a timed-out run is the one whose report
      # is needed most, and !cancelled() skipped it when the job timed out.
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ml:
    name: ML Quality Gate
    needs: [changes]
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Lint, Format Check & Tests
        run: cd ml && make review

  sidecar:
    name: Sidecar Quality Gate
    needs: [changes]
    if: needs.changes.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            sidecar/requirements.txt
            sidecar/requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install dependencies
        run: pip install -r sidecar/requirements-dev.txt

      - name: Lint, Format Check & Tests
        run: cd sidecar && make review PYTHON=python

  # uw-stream and classifier gate check-only: unlike ml/sidecar's
  # `make review` (ruff --fix + ruff format in write mode), fixable lint and
  # format drift fail the job. Every gate after install runs even if an
  # earlier one failed, so a Dependabot bump still reports its test result.
  uw-stream:
    name: uw-stream Quality Gate
    needs: [changes]
    if: needs.changes.outputs.uw_stream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uw-stream
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          # Matches the python:3.12-slim production image.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            uw-stream/requirements.txt
            uw-stream/requirements-dev.txt

      - name: Install dependencies
        id: install
        run: pip install -r requirements-dev.txt

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check src/ tests/ conftest.py

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check src/ tests/ conftest.py

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --cov=src --cov-report=term-missing

  nightly:
    name: nightly Quality Gate
    needs: [changes]
    if: needs.changes.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nightly
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          # Matches the python:3.12-slim production image.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            nightly/requirements.txt
            nightly/requirements-dev.txt

      - name: Install dependencies
        id: install
        run: pip install -r requirements-dev.txt

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check src/ tests/ conftest.py

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check src/ tests/ conftest.py

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --cov=src --cov-report=term-missing

  classifier:
    name: Classifier Quality Gate
    needs: [changes]
    if: needs.changes.outputs.classifier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: classifier
    steps:
      # The sync check finds ml/src/ relative to its own file (not the cwd);
      # fetch-depth limits history only, so depth 1 still has the full tree.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          # Matches the python:3.12-slim production image.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            classifier/requirements.txt
            classifier/requirements-dev.txt

      - name: Install dependencies
        id: install
        run: pip install -r requirements-dev.txt

      # Own step so drift between ml/src/multileg_*.py and _vendored_ml/
      # shows up as a named failure, not one test among the suite.
      # --no-cov: addopts' 95% gate would fail a two-test run.
      - name: Vendored ml/src sync check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest tests/test_vendored_ml_sync.py --no-cov

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check src/ tests/ conftest.py

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check src/ tests/ conftest.py

      - name: Tests (95% coverage gate via pyproject addopts)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest
